name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # Payload CLI commands can hang on an open DB pool; fail fast instead of burning 6 h.
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: handymandoit
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/handymandoit
      PAYLOAD_SECRET: ci-only-secret-not-used-in-production
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # Applies the committed migrations to the empty database, as production does on start (QA-AUTO-12).
      - run: npm run migrate
      # Fails when the Payload config changed without a committed migration (data-model.md §6).
      - run: npm run migrate:check -- --drift
      - run: npm run test:int
      # The home page reads Payload at build time (T-1.15). Seed so the build and e2e see the
      # old-site content, as in local dev. Int tests used their own database (T-1.16).
      - run: npm run seed
      - run: npm run build
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
